<section class="orders-panel">
  <header class="orders-header">
    <h2>Заказы</h2>
    <button type="button" class="order-btn">Заказать лицензию</button>
  </header>

  <article class="licenses-card">
    <div class="card-header">
      <h3>Текущие лицензии</h3>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Автомат</th>
            <th>Тип лицензии</th>
            <th>Срок действия лицензии</th>
            <th>Статус лицензии</th>
            <th>Осталось</th>
          </tr>
        </thead>
        <tbody>
          @for (row of licenses; track row.id) {
            <tr>
              <td>{{ row.id }}</td>
              <td>{{ row.machineId }}</td>
              <td>{{ row.type }}</td>
              <td>{{ row.term }}</td>
              <td>
                <span class="status-badge" [class]="statusClass(row.status)">
                  {{ statusLabel(row.status) }}
                </span>
              </td>
              <td>{{ row.daysLeft }} дней</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </article>
</section>
